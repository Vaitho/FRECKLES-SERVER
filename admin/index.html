<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FrecklesNight · Pannello</title>
<link rel="icon" href="icon.png">
<style>
  :root { --bg:#0d0e13; --card:#16181f; --line:#262933; --text:#f3f1ea; --dim:#a4a3ad; --accent:#ff8a3d; --ok:#4cc38a; --bad:#ef5f5f; --warn:#e8b339; --down:#6aa5f0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 18px; }
  .logo { font-size: 24px; font-weight: 800; color: var(--accent); letter-spacing: -.5px; }
  .logo span { color: var(--text); }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 4px 12px; border-radius: 99px; font-weight: 600; font-size: 13px; background: var(--card); border: 1px solid var(--line); }
  .pill i { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); }
  .pill.ok i { background: var(--ok); } .pill.bad i { background: var(--bad); } .pill.warn i { background: var(--warn); }
  .actions { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }
  button, a.btn { font: inherit; font-size: 14px; font-weight: 600; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 13px; cursor: pointer; text-decoration: none; }
  button:hover, a.btn:hover { border-color: var(--dim); }
  button:disabled { opacity: .45; cursor: default; }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  .tile b { display: block; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tile span, h2 { color: var(--dim); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; }
  .tile small { color: var(--dim); font-size: 12px; }
  h2 { margin: 0 0 10px; }
  section { margin-top: 12px; }
  .two { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 5px 0 10px; }
  .bar div { height: 100%; background: var(--accent); border-radius: 3px; }
  .row { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
  .row span:last-child { color: var(--dim); white-space: nowrap; }
  .legend { display: flex; gap: 18px; margin-bottom: 6px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .legend .up { color: var(--accent); } .legend .dn { color: var(--down); }
  svg { display: block; width: 100%; height: 120px; }
  .scale { color: var(--dim); font-size: 12px; text-align: right; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { text-align: left; color: var(--dim); font-size: 12px; font-weight: 600; padding: 0 8px 6px 0; }
  td { padding: 6px 8px 6px 0; border-top: 1px solid var(--line); }
  th.n, td.n { text-align: right; padding-right: 0; }
  .empty { color: var(--dim); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 6px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
  li:first-child { border-top: 0; padding-top: 0; }
  li em { font-style: normal; color: var(--accent); font-size: 12px; font-weight: 600; margin-right: 6px; }
  pre { margin: 0; max-height: 260px; overflow: auto; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--dim); white-space: pre-wrap; overflow-wrap: anywhere; }
  #msg { color: var(--dim); font-size: 13px; min-height: 18px; margin-top: 10px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="logo">Freckles<span>Night</span></div>
    <span class="pill" id="state"><i></i><span>…</span></span>
    <div class="actions">
      <a class="btn" id="open" target="_blank" rel="noopener">Apri l'app</a>
      <button id="rescan">Aggiorna libreria</button>
      <button id="start">Avvia</button>
      <button id="restart">Riavvia</button>
      <button id="stop" class="danger">Ferma</button>
    </div>
  </header>

  <div class="grid">
    <div class="card tile"><span>Attivo da</span><b id="since">–</b><small id="restarts">&nbsp;</small></div>
    <div class="card tile"><span>Risposta</span><b id="ping">–</b><small id="addr">&nbsp;</small></div>
    <div class="card tile"><span>CPU del PC</span><b id="cpu">–</b><small id="load">&nbsp;</small></div>
    <div class="card tile"><span>Memoria</span><b id="mem">–</b><small id="memsub">&nbsp;</small></div>
    <div class="card tile"><span>Temperatura</span><b id="temp">–</b><small id="up">&nbsp;</small></div>
    <div class="card tile"><span>Server video</span><b id="scpu">–</b><small id="smem">&nbsp;</small></div>
  </div>

  <section class="two">
    <div class="card">
      <h2>Traffico di rete</h2>
      <div class="legend"><span class="up">↑ Inviati <span id="tx">–</span></span><span class="dn">↓ Ricevuti <span id="rx">–</span></span></div>
      <svg id="chart" viewBox="0 0 300 100" preserveAspectRatio="none" role="img" aria-label="Traffico di rete negli ultimi minuti">
        <polyline id="lrx" fill="none" stroke="var(--down)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
        <polyline id="ltx" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>
      </svg>
      <div class="scale" id="scale">ultimi 3 minuti</div>
    </div>
    <div class="card">
      <h2>Dispositivi collegati</h2>
      <table><thead><tr><th>Indirizzo</th><th class="n">Connessioni</th><th class="n">Velocità</th><th class="n">Inviati</th></tr></thead><tbody id="clients"></tbody></table>
    </div>
  </section>

  <section class="two">
    <div class="card"><h2>In corso</h2><ul id="playing"></ul></div>
    <div class="card"><h2>Dischi</h2><div id="disks"></div><h2 style="margin-top:14px">Libreria</h2><div id="lib" class="empty">–</div></div>
  </section>

  <section class="card"><h2>Registro del server</h2><pre id="log"></pre></section>
  <div id="msg"></div>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nf = (n, d = 0) => n.toLocaleString('it-IT', { minimumFractionDigits: d, maximumFractionDigits: d });
function size(b) { const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0; while (b >= 1024 && i < 4) { b /= 1024; i++; } return nf(b, b < 10 && i ? 1 : 0) + ' ' + u[i]; }
function rate(bps) { const m = bps * 8 / 1e6; return m >= 1 ? nf(m, 1) + ' Mbit/s' : nf(bps * 8 / 1e3) + ' kbit/s'; }
function span(sec) {
  sec = Math.max(0, Math.round(sec));
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
  return d ? `${d} g ${h} h` : h ? `${h} h ${m} min` : m ? `${m} min` : `${sec} s`;
}
function clock(sec) { const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = Math.floor(sec % 60); return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); }

const EVERY = 2000, KEEP = 90;
let prev = null, hist = [], busy = false, timer = null, logAt = 0;

function draw(s) {
  const sv = s.service, sys = s.system, on = sv.state === 'active';
  const st = $('state');
  st.className = 'pill ' + (on ? (s.ping === null ? 'warn' : 'ok') : sv.state === 'activating' ? 'warn' : 'bad');
  st.lastElementChild.textContent = on ? (s.ping === null ? 'Attivo, ma non risponde' : 'Attivo') : sv.state === 'activating' ? 'In avvio' : sv.state === 'failed' ? 'Caduto' : 'Fermo';
  $('start').disabled = on || busy; $('stop').disabled = !on || busy; $('restart').disabled = !on || busy; $('rescan').disabled = s.ping === null || busy;
  $('open').href = s.url;

  $('since').textContent = on && sv.since ? span((s.t - sv.since) / 1000) : '–';
  $('restarts').textContent = (sv.enabled ? 'Parte da solo all\'accensione' : 'Avvio automatico spento') + (sv.restarts ? ` · ${sv.restarts} riavvii` : '');
  $('ping').textContent = s.ping === null ? '–' : s.ping + ' ms';
  $('addr').textContent = s.url.replace('http://', '');
  $('mem').textContent = nf((sys.mem.total - sys.mem.avail) / sys.mem.total * 100) + '%';
  $('memsub').textContent = size(sys.mem.total - sys.mem.avail) + ' di ' + size(sys.mem.total);
  $('temp').textContent = sys.temp === null ? '–' : sys.temp + ' °C';
  $('up').textContent = 'PC acceso da ' + span(sys.uptime);
  $('load').textContent = `carico ${nf(sys.load, 2)} su ${sys.cores} core`;
  $('smem').textContent = on ? size(sv.mem) + ' di memoria' : ' ';

  const rates = new Map();
  if (prev) {
    const dt = (s.t - prev.t) / 1000 || 1;
    const dTot = sys.cpu.total - prev.system.cpu.total;
    $('cpu').textContent = dTot > 0 ? nf((1 - (sys.cpu.idle - prev.system.cpu.idle) / dTot) * 100) + '%' : '–';
    $('scpu').textContent = on && sv.pid === prev.service.pid ? nf(Math.max(0, sv.cpuNs - prev.service.cpuNs) / 1e9 / dt * 100) + '% CPU' : '–';
    const tx = Math.max(0, sys.net.tx - prev.system.net.tx) / dt, rx = Math.max(0, sys.net.rx - prev.system.net.rx) / dt;
    $('tx').textContent = rate(tx); $('rx').textContent = rate(rx);
    hist.push({ tx, rx }); if (hist.length > KEEP) hist.shift();
    const before = new Map(prev.conns.map(c => [c.ip + ':' + c.port, c.sent]));
    for (const c of s.conns) {
      const b = before.get(c.ip + ':' + c.port);
      if (b !== undefined) rates.set(c.ip, (rates.get(c.ip) || 0) + Math.max(0, c.sent - b) / dt);
    }
  }
  const max = Math.max(125000, ...hist.map(h => Math.max(h.tx, h.rx)));
  const pts = k => hist.map((h, i) => `${((KEEP - hist.length + i) / (KEEP - 1) * 300).toFixed(1)},${(98 - h[k] / max * 94).toFixed(1)}`).join(' ');
  $('ltx').setAttribute('points', pts('tx')); $('lrx').setAttribute('points', pts('rx'));
  $('scale').textContent = `ultimi 3 minuti · massimo ${rate(max)}`;

  const by = new Map();
  for (const c of s.conns) { const e = by.get(c.ip) || { n: 0, sent: 0 }; e.n++; e.sent += c.sent; by.set(c.ip, e); }
  $('clients').innerHTML = by.size
    ? [...by].map(([ip, e]) => `<tr><td>${esc(ip)}</td><td class="n">${e.n}</td><td class="n">${rates.has(ip) ? rate(rates.get(ip)) : '–'}</td><td class="n">${size(e.sent)}</td></tr>`).join('')
    : '<tr><td colspan="4" class="empty">Nessun dispositivo collegato in questo momento.</td></tr>';

  const items = s.playing.map(f => `<li><em>Riproduzione</em>${esc(f)}</li>`)
    .concat(s.jobs.map(j => `<li><em>${esc(j.kind)}</em>${esc(j.file)}${j.from ? ' · da ' + clock(j.from) : ''}</li>`));
  $('playing').innerHTML = items.length ? items.join('') : '<li class="empty">Nessun video in riproduzione.</li>';

  $('disks').innerHTML = sys.disks.map(d => d.missing
    ? `<div class="row"><span>${esc(d.label)}</span><span style="color:var(--bad)">non montato</span></div><div class="bar"></div>`
    : `<div class="row"><span>${esc(d.label)}</span><span>${size(d.free)} liberi di ${size(d.total)}</span></div><div class="bar"><div style="width:${((1 - d.free / d.total) * 100).toFixed(1)}%"></div></div>`).join('');
  const l = s.library;
  $('lib').className = l ? '' : 'empty';
  $('lib').innerHTML = l
    ? `<div class="row"><span>${l.movies} film · ${l.series} serie · ${l.episodes} episodi</span><span>scansione ${span((s.t - l.scannedAt) / 1000)} fa</span></div>` + (l.processing || l.enriching ? `<div class="empty">${l.processing ? 'Sta creando le anteprime. ' : ''}${l.enriching ? 'Sta scaricando trame e copertine.' : ''}</div>` : '')
    : 'Disponibile quando il server è attivo.';
  prev = s;
}

async function tick() {
  try {
    const s = await (await fetch('/api/stats')).json();
    draw(s); $('msg').textContent = '';
    if (Date.now() - logAt > 6000) loadLog();
  } catch { $('msg').textContent = 'Il pannello non risponde: controlla che il servizio frecklesnight-admin sia attivo.'; }
}
async function loadLog() {
  logAt = Date.now();
  try {
    const el = $('log'), bottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 20;
    const { lines } = await (await fetch('/api/log')).json();
    el.textContent = lines.map(l => l.replace(/^(\S+)T(\d\d:\d\d:\d\d)\S*\s+\S+\s+[^:]+:\s?/, '$1 $2  ')).join('\n') || 'Nessuna riga nel registro.';
    if (bottom) el.scrollTop = el.scrollHeight;
  } catch {}
}
async function act(name, label, ask) {
  if (ask && !confirm(ask)) return;
  busy = true; if (prev) draw(prev);
  $('msg').textContent = label + '…';
  try {
    const r = await fetch('/api/do/' + name, { method: 'POST', headers: { 'x-freckles': '1' } });
    $('msg').textContent = r.ok ? label + ': fatto.' : label + ': non riuscito.';
  } catch { $('msg').textContent = label + ': non riuscito.'; }
  busy = false; logAt = 0; await tick();
}
$('start').onclick = () => act('start', 'Avvio');
$('restart').onclick = () => act('restart', 'Riavvio', 'Riavviare il server? Chi sta guardando un video verrà interrotto.');
$('stop').onclick = () => act('stop', 'Arresto', 'Fermare il server? Nessuno potrà più guardare i video finché non lo riavvii.');
$('rescan').onclick = () => act('rescan', 'Aggiornamento della libreria');

// niente richieste quando la scheda non è in vista
function run() { clearInterval(timer); if (!document.hidden) { tick(); timer = setInterval(tick, EVERY); } }
document.addEventListener('visibilitychange', run);
run();
</script>
</body>
</html>
